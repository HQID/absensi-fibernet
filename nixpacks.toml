[variables]
NIXPACKS_PHP_ROOT_DIR = "/app/public"

[phases.setup]
nixPkgs = [
    "php83",
    "php83Extensions.pdo_mysql",
    "php83Extensions.gd",
    "php83Extensions.zip",
    "php83Extensions.mbstring",
    "php83Extensions.bcmath",
    "php83Extensions.curl",
    "composer",
    "nodejs_22"
]

[phases.build]
cmds = [
    "composer install --no-dev --optimize-autoloader",
    "npm install",
    "npm run build"
]
