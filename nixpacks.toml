[variables]
NIXPACKS_PHP_ROOT_DIR = "/app/public"
NIXPACKS_PHP_VERSION = "8.4"

[phases.setup]
nixPkgs = ["...", "nodejs_22"]

[phases.install]
cmds = ["composer install --no-dev --prefer-dist --no-interaction --ignore-platform-reqs"]

[phases.build]
cmds = [
    "npm install",
    "npm run build"
]
